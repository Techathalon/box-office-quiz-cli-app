name: bollywood-monorepo

services:
  postgres:
    image: postgres:15.3-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bollywood_net

  adminer:
    image: adminer:5.3.0
    container_name: adminer
    restart: always
    ports:
      - '${ADMINER_PORT}:8080'
    depends_on:
      - postgres
    networks:
      - bollywood_net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    env_file:
      - .env
    ports:
      - '${MINIO_PORT}:9000'
      - '${MINIO_CONSOLE_PORT}:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bollywood_net

volumes:
  postgres_data:
  minio_data:
networks:
  bollywood_net:
    driver: bridge
